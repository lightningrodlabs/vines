<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="Description" content="Vines we-applet" />
    <link href="styles.css" rel="stylesheet"/>
    <base href="." />
    <title>Vines we-applet</title>
    <style>
          .spinner {
              position: fixed;
              top: 50%;
              left: 50%;
              width: 50px;
              height: 50px;
              border: 5px solid #f3f3f3;
              border-top: 5px solid #3498db;
              border-radius: 50%;
              animation: spin 1s linear infinite;
          }
          @keyframes spin {
              to { transform: rotate(360deg); }
          }
    </style>
  </head>

  <body style="margin:0px;">

    <script type="module">
      console.log("Vines we-applet index.html START");
      const start = Date.now()
      window.IN_WE = true;

      function formatDuration(ms) {
        const minutes = Math.floor(ms / 60000);
        const seconds = Math.floor((ms % 60000) / 1000);
        const milliseconds = ms % 1000;
        return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${milliseconds.toString().padStart(3, '0')}`;
      }

      document.addEventListener('vines-ready', (e) => {
        const diff = Date.now() - start;
        console.log(`Vines we-applet ready in ${formatDuration(diff)} ms | appId =`, e.detail);
        document.querySelector('.spinner').remove();
      });
    </script>

    <script type="module">
      import setupThreadsApplet from "./src/index.ts";

      setupThreadsApplet().then((happElem) => {
          console.log("Vines we-applet setup DONE - Adding in HappElement");
          document.body.append(happElem);
          console.log("Vines we-applet HappElement Added");
      });

      setTimeout(() => {
        const spinny = document.querySelector('.spinner');
        if (spinny) {
          console.error("Vines we-applet failed to load in a timely manner. Reloading page.");
          window.location.reload();
        }
      }, 10 * 1000);

    </script>

    <div class="spinner"></div>

  </body>

</html>
