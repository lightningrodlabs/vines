name: ci

on:
  push:
    branches: [ main, 'hdk-*' ]
  # No branch filter: every PR gets built, whatever it targets.
  pull_request:

# A new push to the same ref supersedes the one in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-build:
    uses: ./.github/workflows/build-webhapps.yml
    secrets: inherit

  show-artifacts:
    needs: call-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Download previously uploaded artifacts
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      # Display artifacts folder
      - name: Display artifacts folder
        run: ls -la
        working-directory: artifacts
