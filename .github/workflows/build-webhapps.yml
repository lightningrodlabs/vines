name: build-webhapps

on:
  workflow_call:

jobs:
  build-webhapps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin node rather than inheriting whatever ubuntu-latest ships this month
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Install npm dependencies. `npm ci` installs strictly from
      # package-lock.json and fails if the lock and package.json disagree.
      - name: Install npm dependencies
        shell: bash
        run: |
          npm ci
      # install rust tools
      - name: install rust tools
        shell: bash
        run: |
          npm run install:rust
      # Fail fast if Cargo.lock is out of sync with Cargo.toml, so a build can
      # never silently resolve dependencies differently from a local checkout.
      - name: Verify Cargo.lock is up to date
        shell: bash
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true cargo metadata --locked --format-version 1 > /dev/null
      # install zits
      - name: install zits
        shell: bash
        run: |
          npm run install:zits
      # install hc tool
      - name: Install hc tool
        shell: bash
        run: |
          npm run install:hc
      # Install hash-zome
      - name: Install hash-zome
        run: |
          npm run install:hash-zome
      # Download submodules
      - name: Download submodules
        shell: bash
        run: |
          npm run install:submodules
      # Build Files happ
      - name: Build Files happ
        shell: bash
        run: |
          npm run build:files
      # Build happ
      - name: Build happ
        shell: bash
        run: |
          CARGO_NET_GIT_FETCH_WITH_CLI=true npm run build:happ
      # Localize
      - name: Localize
        run: |
          npm run extract:localize
          npm run build:localize
      # Build webapp
      - name: Build webapp
        run: |
          npm run build:webapp
      # Package web-happ
      - name: Package web-happ
        run: |
          npm run package:webapp
      # build we-applet
      - name: build we-applet
        shell: bash
        run: |
          npm run build -w we-applet
      # Package we-applet
      - name: Package we-applet
        shell: bash
        run: |
          npm run package:we
      ## Display we-applet hash
      #- name: Display we-applet hash
      #  run: npm run hash
      # Regroup artifacts
      - name: Regroup artifacts
        run: |
          cp target/wasm32-unknown-unknown/release/*.wasm ./artifacts
      # List uploaded files
      - name: List uploaded files
        run: ls -R
        working-directory: ./artifacts
      # "upload" artifacts
      - uses: actions/upload-artifact@v4
        with:
          path: artifacts
