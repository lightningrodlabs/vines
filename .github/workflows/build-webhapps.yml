name: build-webhapps

# VERIFICATION ONLY. This workflow rebuilds the happ from source to check that
# the tree still builds; it must never publish anything. The happ that ships is
# the frozen one in the happ-v* release (see RELEASE.md and
# scripts/release-happ.sh) — a CI-rebuilt happ has a different DNA hash and
# would fork the network.
on:
  workflow_call:

jobs:
  build-webhapps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = flakes nix-command

      - uses: cachix/cachix-action@v15
        with:
          name: holochain-ci

      - name: Install npm dependencies
        run: nix develop --no-update-lock-file --accept-flake-config --command npm ci

      # The happ embeds the files DNA, built from the files repo's hdk-7.0 branch.
      - name: Download submodules
        run: nix develop --no-update-lock-file --accept-flake-config --command npm run install:submodules

      - name: Build files DNA
        run: nix develop --no-update-lock-file --accept-flake-config --command npm run build:files

      - name: Build happ (verification only — NOT the shipped happ)
        run: nix develop --no-update-lock-file --accept-flake-config --command npm run build:happ

      - name: Build UI
        run: nix develop --no-update-lock-file --accept-flake-config --command npm run build:webapp

      - name: Pack we-applet webhapp (verification only)
        run: nix develop --no-update-lock-file --accept-flake-config --command npm run dist:we

      - name: Report hashes of this verification build
        run: |
          sha256sum artifacts/threads.dna artifacts/files.dna artifacts/vines.happ artifacts/vines-we_applet.webhapp
          echo "Canonical (frozen) happ sha256, for reference: $(tr -d '[:space:]' < .happ-sha256)"

      - uses: actions/upload-artifact@v4
        with:
          name: verification-build
          path: |
            artifacts/threads.dna
            artifacts/files.dna
            artifacts/vines.happ
            artifacts/vines-we_applet.webhapp
