name: release-manually

on: workflow_dispatch

jobs:
  call-build:
    uses: ./.github/workflows/build-webhapps.yml
    secrets: inherit

  upload-artifacts:
    needs: call-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Download previously uploaded artifacts
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      # Display artifacts folder
      - name: Display artifacts folder
        run: ls
        working-directory: artifacts
      # upload all artifacts
      - name: upload binary (ubuntu only)
        if: ${{ runner.os == 'Linux' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: artifacts
        run: |
          rm -f *.blockmap    
          gh release upload "manual-release" *.dna --clobber
          gh release upload "manual-release" vines* --clobber
