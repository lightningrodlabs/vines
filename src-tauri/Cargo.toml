[package]
name = "vinesapp"
version = "0.1.0"
description = "Vines"
authors = ["you"]
homepage = "https://github.com/lightningrodlabs/vines"
license = "CAL 1.0"
repository = ""
edition = "2021"
rust-version = "1.70"
resolver = "2"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.2.0", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.5.1", features = [] }
tauri-plugin-holochain = { git = "https://github.com/darksoil-studio/tauri-plugin-holochain", branch = "main-0.6"}
holochain = { version = "0.6.0" }
holochain_types = { version = "0.6.0" }
lair_keystore = { version = "0.6.3" }

log = "0.4"
tauri-plugin-log = "2.4.0"
tauri-plugin-opener = "2.2.7"
tauri-plugin-os = "2.2.1"
url2 = "0.0.6"
app_dirs2 = "2.5.5"
anyhow = "1"
serde_json = "1.0.120"

[profile.dev.package."*"]
debug = false # workaround for "not enough space" issue on android
