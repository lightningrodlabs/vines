[workspace]
resolver = "2"
members = [
    "dna/zomes/path_explorer",
    "dna/zomes/authorship_integrity",
    "dna/zomes/authorship_coordinator",
    "dna/zomes/authorship_zapi",
    "dna/zomes/profiles_integrity",
    "dna/zomes/profiles",
    "dna/zomes/threads_integrity",
    "dna/zomes/threads",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
rust-version = "1.75.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false }
holochain_serialized_bytes = "=0.0.57"
hdi = { version = "=0.7.1", default-features = false }
hdk = { version = "=0.6.1", default-features = false }

# Git dependencies are pinned to an exact rev, not a branch, so that a push
# upstream cannot silently change what this repo builds. To bump, resolve the
# branch head yourself and replace every rev for that repo in one commit:
#   git ls-remote https://github.com/ddd-mtl/zdk main-0.6
#
# zdk @ main-0.6 (302a90f2 requires hdi =0.7.1 / hdk =0.6.1, matching above)
zome_utils = { git = "https://github.com/ddd-mtl/zdk", rev = "302a90f2dd7b65feec1797bc808e41e1b81cf6fd" }
zome_path = { git = "https://github.com/ddd-mtl/zdk", rev = "302a90f2dd7b65feec1797bc808e41e1b81cf6fd" }
zome_signals = { git = "https://github.com/ddd-mtl/zdk", rev = "302a90f2dd7b65feec1797bc808e41e1b81cf6fd" }
zome_core = { git = "https://github.com/ddd-mtl/zdk", rev = "302a90f2dd7b65feec1797bc808e41e1b81cf6fd" }

time_indexing = { git = "https://github.com/ddd-mtl/zdk", rev = "302a90f2dd7b65feec1797bc808e41e1b81cf6fd" }
path_explorer_types = { git = "https://github.com/ddd-mtl/zdk", rev = "302a90f2dd7b65feec1797bc808e41e1b81cf6fd" }
path_explorer = { git = "https://github.com/ddd-mtl/zdk", rev = "302a90f2dd7b65feec1797bc808e41e1b81cf6fd" }

# profiles @ main-0.6 head. Repo also publishes tags (v0.601.4, v0.700.0), but
# the branch has moved past v0.601.4 -- this rev is what CI was already building.
hc_zome_profiles_integrity = { git = "https://github.com/holochain-open-dev/profiles", rev = "b3f14fb9d7ceadf274dc4cb2d5971b88803f8af7" }
hc_zome_profiles_coordinator = { git = "https://github.com/ddd-mtl/zdk", rev = "302a90f2dd7b65feec1797bc808e41e1b81cf6fd", package = "profiles_alt_coordinator" }


[profile.dev]
lto = false
opt-level = 0
overflow-checks = false

[profile.release]
opt-level = "z"
#incremental = false
#codegen-units = 1
#panic = "abort"
#lto = true
lto = false
