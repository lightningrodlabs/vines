[workspace]
resolver = "2"
members = [
    "dna/zomes/path_explorer",
    "dna/zomes/authorship_integrity",
    "dna/zomes/authorship_coordinator",
    "dna/zomes/authorship_zapi",
    "dna/zomes/profiles_integrity",
    "dna/zomes/profiles",
    "dna/zomes/threads_integrity",
    "dna/zomes/threads",
]
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
rust-version = "1.75.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false }
holochain_serialized_bytes = "=0.0.57"
hdi = { version = "=0.8.1", default-features = false, features = ["trace"] }
hdk = { version = "=0.7.1", default-features = false }

# zdk 0.7 line, rev-pinned. Never a branch: a branch ref floats, so two builds of the
# same commit of this repo can end up on different zdk code. Same rev as files pins.
zome_utils = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c" }
zome_path = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c" }
zome_signals = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c" }
zome_core = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c" }

time_indexing = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c" }
path_explorer_types = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c" }
path_explorer = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c" }

# v0.702.0: zdk at this rev pins v0.702.0, and two copies of
# hc_zome_profiles_integrity in one graph means the coordinator and integrity zomes
# disagree about EntryTypes.
hc_zome_profiles_integrity = { git = "https://github.com/holochain-open-dev/profiles", tag = "v0.702.0" }
hc_zome_profiles_coordinator = { git = "https://github.com/ddd-mtl/zdk", rev = "90f79989400e2930587b196ef56d488bf9ac808c", package = "profiles_alt_coordinator" }


[profile.dev]
lto = false
opt-level = 0
overflow-checks = false

[profile.release]
opt-level = "z"
#incremental = false
#codegen-units = 1
#panic = "abort"
#lto = true
lto = false
