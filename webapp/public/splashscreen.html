<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vines</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f3f3;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            flex-direction: column;
            gap: 32px;
        }
        .logo {
            /*width: 280px;*/
        }
        .title {
            font-size: 24px;
            color: #333;
        }
        .status {
            font-size: 14px;
            color: #636363;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #555;
            border-top-color: #9cff82;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <img src="icon.png" alt="Logo" class="logo">
    <h1 class="title">Vines</h1>
    <div class="status">
        <div class="spinner"></div>
        Starting Holochain...
    </div>
</body>
</html>
